<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen Garden</title>
<style>
:root{
  --linen:#F1EAE0; --paper:#F8F3EA; --sand:#E4D5B7; --wet:#B69B72;
  --tray:#2B2622; --tray-hi:#3A332D; --clay:#A8654A; --clay-dark:#8E5239; --moss:#6B7A5A;
  --ink:#2B2622; --muted:#7A6F63; --line:#E2D8C8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--linen);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
main{width:min(92vw,560px);padding:30px 0 56px;display:flex;flex-direction:column;align-items:center;gap:22px}
header{text-align:center}
h1{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:.02em;margin:0 0 8px}
.sub{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.55;max-width:42ch;min-height:2.6em}
.tray-wrap{position:relative;width:100%;aspect-ratio:1}
canvas#garden{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 22px 46px -20px rgba(43,38,34,.5);touch-action:none;user-select:none;-webkit-user-select:none}
.cue{position:absolute;left:50%;bottom:-8px;transform:translate(-50%,100%);font-size:13px;color:var(--muted);opacity:0;transition:opacity 1.4s;pointer-events:none;white-space:nowrap;font-style:italic;font-family:var(--serif);font-size:15px}
.cue.show{opacity:1}
.controls{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;margin-top:18px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;color:var(--ink);background:var(--paper);padding:12px 22px;font-size:15px;transition:background .3s,color .3s,opacity .3s,transform .15s}
button:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
button[disabled]{opacity:.45;cursor:default}
.primary{background:var(--tray);color:var(--paper);padding:14px 30px}
.primary:hover{background:var(--tray-hi)}
.hold{position:relative;background:var(--clay);color:var(--paper);width:136px;height:136px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .6s,box-shadow 1.6s,transform .15s}
.hold small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.hold.holding{background:var(--clay-dark);transform:scale(.97)}
.hold.glow{box-shadow:0 0 0 10px rgba(168,101,74,.16)}
.hold svg{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.hold svg circle{fill:none;stroke-width:3}
.hold svg .track{stroke:rgba(43,38,34,.10)}
.hold svg .fill{stroke:var(--clay)}
.status{display:flex;gap:22px;color:var(--muted);font-size:13px;letter-spacing:.02em}
.status b{color:var(--ink);font-weight:500}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.ghost{background:transparent;color:var(--muted);padding:8px 12px;font-size:13px}
.ghost:hover{color:var(--ink)}
.card{background:var(--paper);border-radius:22px;padding:28px 28px 26px;width:100%;text-align:center;box-shadow:0 14px 34px -22px rgba(43,38,34,.4);transform:translateY(14px);opacity:0;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .7s}
.card.show{transform:none;opacity:1}
.card .label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.card .score{font-family:var(--serif);font-size:58px;line-height:1.05;margin:6px 0 10px}
.card .stones{font-size:22px;letter-spacing:.32em;color:var(--moss);margin-bottom:14px}
.card .stones .off{color:var(--line)}
.card .verdict{font-family:var(--serif);font-style:italic;font-size:19px;margin:0 0 10px}
.card .breakdown{color:var(--muted);font-size:14px;margin:0 0 20px}
.best{color:var(--muted);font-size:13px;margin:0}
.debug{position:fixed;left:8px;top:8px;font:11px/1.45 ui-monospace,Menlo,monospace;color:var(--muted);background:rgba(248,243,234,.92);padding:6px 9px;border-radius:8px;white-space:pre;pointer-events:none}
[hidden]{display:none!important}
@media (max-width:420px){h1{font-size:26px}.card .score{font-size:50px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Zen Garden</h1>
    <p class="sub" id="sub">Start the rake. Then add exactly as much sand as the holes need, in one pour.</p>
  </header>
  <div class="tray-wrap">
    <canvas id="garden" aria-label="Sand garden with a rotating rake"></canvas>
    <div class="cue" id="cue">The rake carries nothing.</div>
  </div>
  <section class="controls">
    <button class="primary" id="startBtn">Start raking</button>
    <button class="hold" id="addBtn" hidden aria-label="Add sand. Press and hold, release to pour.">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="48"/><circle class="fill" id="ring" cx="50" cy="50" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg>
      <span>Add sand</span><small>hold</small>
    </button>
    <div class="status" id="status" hidden><span>Pours <b id="pours">0</b></span><span>Time <b id="time">0:00</b></span></div>
    <div class="card" id="card" hidden>
      <div class="label">Garden complete</div>
      <div class="score" id="score">0</div>
      <div class="stones" id="stones" aria-label="Rating"></div>
      <p class="verdict" id="verdict"></p>
      <p class="breakdown" id="breakdown"></p>
      <button class="primary" id="againBtn">New garden</button>
    </div>
    <div class="row">
      <button class="ghost" id="soundBtn" aria-pressed="false">Sound off</button>
      <p class="best" id="best"></p>
    </div>
  </section>
</main>
<div class="debug" id="debug" hidden></div>
<script>
'use strict';
// ==== SIM BEGIN ==========================================================
// Everything between SIM BEGIN and SIM END is pure and DOM-free, so it can
// be extracted and run in Node for tuning (see README).
const CFG = {
  N: 200,            // heightmap grid
  L: 1,              // level height
  POST_FRAC: 0.06,   // center post radius as fraction of R
  ROT_PERIOD: 24,    // seconds per rotation
  NBINS: 40,         // radial bins for carried sand
  K_DIFF: 0.09,      // carried-sand diffusion per 1/60 s (tuned: 1.08·D pour fills in ~5.5 rotations)
  MAX_STEP: 5 * Math.PI / 180,
  SLOPE: 0.03,       // angle of repose: height per cell, shared by holes and pours
  HOPPER_R: 0.55,    // hopper spot radius as fraction of R
  HOPPER_ANG: -Math.PI / 2,
  D_REF: 900,        // reference deficit in sand units (cell area x height)
  D_MIN_F: 0.7, D_MAX_F: 1.3,
  HOLD_MID_S: 8,     // seconds of hold to reach D_REF
  HOLD_CAP_S: 16,    // hard cap
  RIM_MARGIN: 0.08,
  GROOM_EPS: 0.01,
  END_FRAC: 0.005,
  TOOTH: 4,          // ripple spacing in cells
};
const HOLD_RATE = CFG.D_REF / CFG.HOLD_MID_S;
const HOLD_CAP = HOLD_RATE * CFG.HOLD_CAP_S;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function smoothstep(e0, e1, x) { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }
// Rounded cone: profile(d) = depth * (1 - smoothstep(0, r, d)); volume = 0.3 * pi * depth * r^2, depth = slope * r
function coneRadiusForVolume(V, slope = CFG.SLOPE) { return Math.cbrt(Math.max(0, V) / (0.3 * Math.PI * slope)); }

function createSim(seed) {
  const N = CFG.N, L = CFG.L, rnd = mulberry32(seed);
  const cx = N / 2, cy = N / 2, R = N / 2 - 2, postR = CFG.POST_FRAC * R;
  const h = new Float64Array(N * N), previewH = new Float64Array(N * N);
  const mask = new Uint8Array(N * N), groomed = new Uint8Array(N * N), binOf = new Uint8Array(N * N);
  const cellR = new Float32Array(N * N), cellX = new Float32Array(N * N), cellY = new Float32Array(N * N), cellAng = new Float32Array(N * N);
  const order = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const idx = j * N + i, x = i + 0.5 - cx, y = j + 0.5 - cy, r = Math.hypot(x, y);
    cellX[idx] = x; cellY[idx] = y; cellR[idx] = r;
    let a = Math.atan2(y, x); if (a < 0) a += 2 * Math.PI; cellAng[idx] = a;
    if (r <= R && r >= postR) {
      mask[idx] = 1;
      binOf[idx] = Math.min(CFG.NBINS - 1, Math.floor((r - postR) / (R - postR) * CFG.NBINS));
      order.push(idx);
    }
  }
  order.sort((a, b) => cellAng[a] - cellAng[b]);
  const orderArr = Uint32Array.from(order), orderAng = Float64Array.from(order, i => cellAng[i]);
  const M = orderArr.length;

  // --- terrain -----------------------------------------------------------
  function valueNoise(cells, amp) {
    const g = cells + 1, grid = new Float32Array(g * g);
    for (let k = 0; k < g * g; k++) grid[k] = rnd() * 2 - 1;
    return (x, y) => {
      const fx = x / N * cells, fy = y / N * cells, ix = Math.min(cells - 1, Math.floor(fx)), iy = Math.min(cells - 1, Math.floor(fy));
      const tx = smoothstep(0, 1, fx - ix), ty = smoothstep(0, 1, fy - iy);
      const v00 = grid[iy * g + ix], v10 = grid[iy * g + ix + 1], v01 = grid[(iy + 1) * g + ix], v11 = grid[(iy + 1) * g + ix + 1];
      return amp * ((v00 * (1 - tx) + v10 * tx) * (1 - ty) + (v01 * (1 - tx) + v11 * tx) * ty);
    };
  }
  const n0 = valueNoise(3, 0.02), n1 = valueNoise(6, 0.02), n2 = valueNoise(14, 0.008);
  for (let k = 0; k < M; k++) { const idx = orderArr[k]; const i = idx % N, j = (idx - i) / N; h[idx] = L + n0(i, j) + n1(i, j) + n2(i, j); }

  const hopper = { x: cx + CFG.HOPPER_R * R * Math.cos(CFG.HOPPER_ANG), y: cy + CFG.HOPPER_R * R * Math.sin(CFG.HOPPER_ANG) };
  const features = [{ x: hopper.x, y: hopper.y, r: 10 }];
  function place(r) {
    for (let t = 0; t < 600; t++) {
      const a = rnd() * 2 * Math.PI, rr = Math.sqrt(rnd()) * (R * (1 - CFG.RIM_MARGIN) - r);
      if (rr < postR + r) continue;
      const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
      let ok = true;
      for (const f of features) if (Math.hypot(x - f.x, y - f.y) < 1.15 * (r + f.r)) { ok = false; break; }
      if (ok) { features.push({ x, y, r }); return { x, y }; }
    }
    return null;
  }
  function addCone(x0, y0, r, depth, sign, arr, ungroom) {
    let vol = 0;
    const i0 = Math.max(0, Math.floor(x0 - r - 1)), i1 = Math.min(N - 1, Math.ceil(x0 + r + 1));
    const j0 = Math.max(0, Math.floor(y0 - r - 1)), j1 = Math.min(N - 1, Math.ceil(y0 + r + 1));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const idx = j * N + i; if (!mask[idx]) continue;
      const d = Math.hypot(i + 0.5 - x0, j + 0.5 - y0); if (d >= r) continue;
      const v = depth * (1 - smoothstep(0, r, d));
      arr[idx] += sign * v; vol += v;
      if (ungroom) groomed[idx] = 0;
    }
    return vol;
  }
  // small bumps: uneven look, <= 5% of D
  const Dtarget = CFG.D_REF * (CFG.D_MIN_F + rnd() * (CFG.D_MAX_F - CFG.D_MIN_F));
  const nb = 2 + Math.floor(rnd() * 2), bumpV = Dtarget * 0.05 / nb;
  for (let k = 0; k < nb; k++) { const r = coneRadiusForVolume(bumpV, CFG.SLOPE * 0.5); const p = place(r); if (p) addCone(p.x, p.y, r, CFG.SLOPE * 0.5 * r, +1, h, false); }
  // holes: rounded cones with the shared slope, scaled so D lands on target
  const nh = 4 + Math.floor(rnd() * 4), weights = []; let ws = 0;
  for (let k = 0; k < nh; k++) { const w = 0.5 + rnd(); weights.push(w); ws += w; }
  const holes = [];
  for (let k = 0; k < nh; k++) { const V = Dtarget * weights[k] / ws, r = coneRadiusForVolume(V); const p = place(r); if (p) holes.push({ x: p.x, y: p.y, V }); }
  const base = Float64Array.from(h);
  let scale = 1;
  for (let it = 0; it < 4; it++) {
    h.set(base);
    for (const ho of holes) { const r = coneRadiusForVolume(ho.V * scale); ho.r = r; addCone(ho.x, ho.y, r, CFG.SLOPE * r, -1, h, false); }
    const d = deficit() - excessAbove();
    if (Math.abs(d - Dtarget) / Dtarget < 0.01) break;
    scale *= Math.min(1.4, Math.max(0.7, Dtarget / Math.max(1, d)));
  }

  // --- state -------------------------------------------------------------
  const carried = [new Float64Array(CFG.NBINS), new Float64Array(CFG.NBINS)];
  const tmp = new Float64Array(CFG.NBINS);
  const S = { theta: 0, t: 0, added: 0, pours: 0, D: 0, initialTotal: 0, remaining: 0, flux: 0, rotations: 0, lastCheck: 0 };
  S.D = deficit() - excessAbove();
  S.remaining = deficit();
  S.initialTotal = total();

  function deficit() { let d = 0; for (let k = 0; k < M; k++) { const v = L - h[orderArr[k]]; if (v > 0) d += v; } return d; }
  function excessAbove() { let d = 0; for (let k = 0; k < M; k++) { const v = h[orderArr[k]] - L; if (v > 0) d += v; } return d; }
  function total() { let s = 0; for (let k = 0; k < M; k++) s += h[orderArr[k]]; for (let b = 0; b < CFG.NBINS; b++) s += carried[0][b] + carried[1][b]; return s; }
  function carriedTotal() { let s = 0; for (let b = 0; b < CFG.NBINS; b++) s += carried[0][b] + carried[1][b]; return s; }

  function lowerBound(a) { let lo = 0, hi = M; while (lo < hi) { const mid = (lo + hi) >> 1; if (orderAng[mid] < a) lo = mid + 1; else hi = mid; } return lo; }
  const TWO = 2 * Math.PI;
  function sweep(a0, da, c, toothed) {
    a0 = ((a0 % TWO) + TWO) % TWO;
    let k = lowerBound(a0); if (k >= M) k = 0;
    for (let n = 0; n < M; n++) {
      let rel = orderAng[k] - a0; if (rel < 0) rel += TWO;
      if (rel >= da) break;
      const idx = orderArr[k], b = binOf[idx], v = h[idx];
      if (v > L) { c[b] += v - L; h[idx] = L; S.flux += v - L; groomed[idx] = toothed; }
      else if (v < L) {
        const need = L - v, f = c[b] < need ? c[b] : need;
        if (f > 0) { h[idx] = v + f; c[b] -= f; S.flux += f; }
        groomed[idx] = (L - h[idx] <= CFG.GROOM_EPS) ? toothed : 0;
      } else groomed[idx] = toothed;
      k++; if (k >= M) k = 0;
    }
  }
  function diffuse(c, k) {
    const n = c.length;
    for (let b = 0; b < n; b++) { const l = b > 0 ? c[b - 1] : c[b], r = b < n - 1 ? c[b + 1] : c[b]; tmp[b] = c[b] + k * (l + r - 2 * c[b]); }
    c.set(tmp);
  }
  function step(dt) {
    if (dt <= 0) return;
    const dth = TWO / CFG.ROT_PERIOD * dt;
    const nsub = Math.max(1, Math.ceil(dth / CFG.MAX_STEP), Math.ceil(CFG.K_DIFF * dt * 60 / 0.4));
    const sdt = dt / nsub, sdth = dth / nsub, k = CFG.K_DIFF * sdt * 60;
    S.flux = 0;
    for (let s = 0; s < nsub; s++) {
      const a0 = S.theta; S.theta += sdth;
      sweep(a0, sdth, carried[0], 1);
      sweep(a0 + Math.PI, sdth, carried[1], 0);
      diffuse(carried[0], k); diffuse(carried[1], k);
    }
    S.t += dt; S.rotations = S.theta / TWO; S.flux /= dt;
    if (S.t - S.lastCheck >= 0.5) { S.lastCheck = S.t; S.remaining = deficit(); }
  }
  function pour(V) {
    const r = coneRadiusForVolume(V);
    const actual = addCone(hopper.x, hopper.y, r, CFG.SLOPE * r, +1, h, true);
    S.added += actual; S.pours++; S.remaining = deficit();
    return actual;
  }
  let pb = null;
  function setPreview(V) {
    if (pb) { for (let j = pb.j0; j <= pb.j1; j++) for (let i = pb.i0; i <= pb.i1; i++) previewH[j * N + i] = 0; pb = null; }
    if (V <= 0) return 0;
    const r = coneRadiusForVolume(V);
    pb = { i0: Math.max(0, Math.floor(hopper.x - r - 1)), i1: Math.min(N - 1, Math.ceil(hopper.x + r + 1)), j0: Math.max(0, Math.floor(hopper.y - r - 1)), j1: Math.min(N - 1, Math.ceil(hopper.y + r + 1)) };
    addCone(hopper.x, hopper.y, r, CFG.SLOPE * r, +1, previewH, false);
    return r;
  }
  function isComplete() { return S.remaining <= CFG.END_FRAC * S.D; }
  function snap() { for (let k = 0; k < M; k++) { const idx = orderArr[k]; h[idx] = L; groomed[idx] = 1; } S.remaining = 0; }

  return { N, R, postR, cx, cy, h, previewH, mask, groomed, cellR, cellX, cellY, carried, S, hopper, holes, step, pour, setPreview, deficit, total, carriedTotal, isComplete, snap };
}

function scoreFor(pours, added, D) {
  const mult = [1, 0.75, 0.55, 0.4][Math.max(0, Math.min(pours, 4) - 1)];
  const e = (added - D) / D;
  const prec = e <= 0.10 ? 1 : Math.max(0.2, 1 - 1.5 * (e - 0.10));
  const score = Math.round(1000 * mult * prec);
  const stones = score >= 900 ? 5 : score >= 750 ? 4 : score >= 550 ? 3 : score >= 350 ? 2 : 1;
  return { score, stones, e, mult, prec };
}
const VERDICTS = ['The rake keeps turning.', 'Patience, more than sand.', 'The garden settles.', 'Even, with a little to spare.', 'Nothing to add, nothing to take away.'];
function excessWords(e) {
  if (e < 0.03) return 'almost exactly the right amount';
  if (e < 0.08) return 'a pinch to spare';
  if (e < 0.15) return 'about a tenth too much';
  if (e < 0.22) return 'about a fifth too much';
  if (e < 0.30) return 'about a quarter too much';
  if (e < 0.42) return 'about a third too much';
  if (e < 0.62) return 'about half too much';
  if (e < 0.90) return 'about three quarters too much';
  return 'about twice what was needed';
}
// ==== SIM END ============================================================

// ==== Renderer ===========================================================
const canvas = document.getElementById('garden');
const ctx = canvas.getContext('2d');
const off = document.createElement('canvas'); off.width = off.height = CFG.N;
const octx = off.getContext('2d');
const img = octx.createImageData(CFG.N, CFG.N), px = img.data;
const disp = new Float32Array(CFG.N * CFG.N);
const grain = new Float32Array(CFG.N * CFG.N); { const g = mulberry32(7); for (let k = 0; k < grain.length; k++) grain[k] = 0.965 + g() * 0.07; }
const SAND = [0xE4, 0xD5, 0xB7], WET = [0xB6, 0x9B, 0x72], GHOST = [0xCD, 0xC0, 0xA9];
const LX = -0.55, LY = -0.7, LZ = 0.55, LN = Math.hypot(LX, LY, LZ), lx = LX / LN, ly = LY / LN, lz = LZ / LN;

function renderHeight(sim, settleK) {
  const { N, h, previewH, mask, groomed, cellR, cellX, cellY } = sim, L = CFG.L, S = 22;
  for (let k = 0; k < N * N; k++) disp[k] = mask[k] ? h[k] + (L - h[k]) * settleK + previewH[k] : L;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const idx = j * N + i, o = idx * 4;
    if (!mask[idx]) { px[o + 3] = 0; continue; }
    const c = disp[idx];
    const l = (i > 0 && mask[idx - 1]) ? disp[idx - 1] : c, r = (i < N - 1 && mask[idx + 1]) ? disp[idx + 1] : c;
    const u = (j > 0 && mask[idx - N]) ? disp[idx - N] : c, d = (j < N - 1 && mask[idx + N]) ? disp[idx + N] : c;
    let gx = (r - l) * 0.5, gy = (d - u) * 0.5;
    if (groomed[idx]) { const rr = cellR[idx]; const rip = 0.012 * Math.sin(2 * Math.PI * rr / CFG.TOOTH); gx += rip * cellX[idx] / rr; gy += rip * cellY[idx] / rr; }
    const nx = -gx * S, ny = -gy * S, inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
    const lam = Math.max(0, (nx * lx + ny * ly + lz) * inv);
    let shade = Math.min(1.12, 0.5 + 0.5 * lam / lz) * grain[idx];
    const below = L - (h[idx] + (L - h[idx]) * settleK);
    const depth = Math.min(1, Math.max(0, below / 0.6));
    if (below > 0.02) { const f = (below / 0.1) % 1; if (f < 0.10) shade *= 0.9; }
    let cr = SAND[0] + (WET[0] - SAND[0]) * depth, cg = SAND[1] + (WET[1] - SAND[1]) * depth, cb = SAND[2] + (WET[2] - SAND[2]) * depth;
    if (previewH[idx] > 0.002) { cr = cr * 0.55 + GHOST[0] * 0.45; cg = cg * 0.55 + GHOST[1] * 0.45; cb = cb * 0.55 + GHOST[2] * 0.45; }
    px[o] = cr * shade; px[o + 1] = cg * shade; px[o + 2] = cb * shade; px[o + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
}

function roundRect(c, x, y, w, hgt, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + hgt, r); c.arcTo(x + w, y + hgt, x, y + hgt, r); c.arcTo(x, y + hgt, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function render(sim, opts) {
  const W = canvas.width; if (!W) return;
  const C = W / 2, Ri = C * 0.90, scale = Ri / sim.R;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, W);
  // tray
  ctx.fillStyle = '#2B2622'; ctx.beginPath(); ctx.arc(C, C, C, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = '#3A332D'; ctx.lineWidth = Math.max(1.5, W * 0.006); ctx.beginPath(); ctx.arc(C, C, C - ctx.lineWidth * 1.2, 0, 2 * Math.PI); ctx.stroke();
  // sand
  renderHeight(sim, opts.settleK);
  ctx.save(); ctx.beginPath(); ctx.arc(C, C, Ri, 0, 2 * Math.PI); ctx.clip();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const size = sim.N * scale; ctx.drawImage(off, C - size / 2, C - size / 2, size, size);
  // wall shadow
  const sh = ctx.createRadialGradient(C, C, Ri * 0.9, C, C, Ri); sh.addColorStop(0, 'rgba(43,38,34,0)'); sh.addColorStop(1, 'rgba(43,38,34,0.42)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, W, W);
  ctx.restore();
  // hopper spout mark
  const hx = C + Math.cos(CFG.HOPPER_ANG) * (C + Ri) / 2, hy = C + Math.sin(CFG.HOPPER_ANG) * (C + Ri) / 2;
  ctx.fillStyle = '#A8654A'; ctx.beginPath(); ctx.arc(hx, hy, W * 0.012, 0, 2 * Math.PI); ctx.fill();
  // preview outline
  if (opts.previewR > 0) {
    const pxh = C + (sim.hopper.x - sim.cx) * scale, pyh = C + (sim.hopper.y - sim.cy) * scale;
    ctx.setLineDash([W * 0.008, W * 0.008]); ctx.strokeStyle = 'rgba(43,38,34,0.38)'; ctx.lineWidth = Math.max(1, W * 0.0025);
    ctx.beginPath(); ctx.arc(pxh, pyh, opts.previewR * scale, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
  }
  // rake bar + heaps
  ctx.save(); ctx.translate(C, C); ctx.rotate(sim.S.theta);
  const bw = W * 0.026, postPx = sim.postR * scale, len = Ri - W * 0.004;
  // heaps ahead of the bar (+y side)
  for (let half = 0; half < 2; half++) {
    const c = sim.carried[half], sgn = half === 0 ? 1 : -1, side = sgn; // the -x half leads on its -y side
    ctx.beginPath(); ctx.moveTo(sgn * postPx, side * bw / 2);
    for (let b = 0; b < CFG.NBINS; b++) {
      const r0 = sim.postR + (b + 0.5) / CFG.NBINS * (sim.R - sim.postR);
      const w = Math.min(14, 1.7 * Math.sqrt(c[b])) * scale;
      ctx.lineTo(sgn * r0 * scale, side * (bw / 2 + w));
    }
    ctx.lineTo(sgn * len, side * bw / 2); ctx.closePath();
    ctx.fillStyle = 'rgba(182,155,114,0.92)'; ctx.fill();
    ctx.strokeStyle = 'rgba(228,213,183,0.55)'; ctx.lineWidth = Math.max(1, W * 0.002); ctx.stroke();
  }
  // plain blade (-x) and toothed blade (+x)
  ctx.fillStyle = '#2B2622';
  roundRect(ctx, -len, -bw / 2, len * 2, bw, bw / 2); ctx.fill();
  ctx.beginPath();
  const toothW = CFG.TOOTH * scale, toothH = bw * 0.55;
  for (let x = postPx + toothW; x < len - toothW; x += toothW) { ctx.moveTo(x - toothW * 0.45, bw / 2); ctx.lineTo(x, bw / 2 + toothH); ctx.lineTo(x + toothW * 0.45, bw / 2); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = Math.max(1, W * 0.0015);
  ctx.beginPath(); ctx.moveTo(-len + bw / 2, -bw / 2 + ctx.lineWidth); ctx.lineTo(len - bw / 2, -bw / 2 + ctx.lineWidth); ctx.stroke();
  // post
  ctx.fillStyle = '#2B2622'; ctx.beginPath(); ctx.arc(0, 0, postPx * 1.05, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#3A332D'; ctx.beginPath(); ctx.arc(-postPx * 0.15, -postPx * 0.15, postPx * 0.55, 0, 2 * Math.PI); ctx.fill();
  ctx.restore();
}

// ==== Audio ==============================================================
const audio = {
  ctx: null, master: null, noiseGain: null, enabled: false,
  ensure() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = this.enabled ? 1 : 0; this.master.connect(c.destination);
      // sand hiss
      const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), data = buf.getChannelData(0);
      let b0 = 0, b1 = 0; for (let i = 0; i < data.length; i++) { const w = Math.random() * 2 - 1; b0 = 0.99 * b0 + w * 0.05; b1 = 0.96 * b1 + w * 0.15; data[i] = (b0 + b1 + w * 0.3) * 0.6; }
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 0.4;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180;
      this.noiseGain = c.createGain(); this.noiseGain.gain.value = 0;
      src.connect(hp); hp.connect(lp); lp.connect(this.noiseGain); this.noiseGain.connect(this.master); src.start();
      // low pad
      const padGain = c.createGain(); padGain.gain.value = 0.028; padGain.connect(this.master);
      const pf = c.createBiquadFilter(); pf.type = 'lowpass'; pf.frequency.value = 420; pf.connect(padGain);
      const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 110; o1.connect(pf); o1.start();
      const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 164.8; o2.detune.value = 4; const g2 = c.createGain(); g2.gain.value = 0.35; o2.connect(g2); g2.connect(pf); o2.start();
      const lfo = c.createOscillator(); lfo.frequency.value = 0.07; const lg = c.createGain(); lg.gain.value = 160; lfo.connect(lg); lg.connect(pf.frequency); lfo.start();
      return true;
    } catch (e) { return false; }
  },
  setEnabled(on) {
    this.enabled = on;
    if (!on && !this.ctx) return;
    if (!this.ensure()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.master.gain.setTargetAtTime(on ? 1 : 0, this.ctx.currentTime, 0.4);
  },
  setFlux(flux, raking) {
    if (!this.ctx || !this.enabled) return;
    const target = raking ? 0.012 + Math.min(0.26, flux * 0.025) : 0;
    this.noiseGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.25);
  },
  pour() {
    if (!this.ctx || !this.enabled) return;
    const c = this.ctx, t = c.currentTime, g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    const buf = c.createBuffer(1, c.sampleRate, c.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 0.8;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 1);
  },
  chime() {
    if (!this.ctx || !this.enabled) return;
    const c = this.ctx, t = c.currentTime;
    [[523.25, 0], [659.25, 0.35], [783.99, 0.7]].forEach(([f, dt]) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.16, t + dt + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 2.4);
      o.connect(g); g.connect(this.master); o.start(t + dt); o.stop(t + dt + 2.5);
    });
  },
  pause() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  resume() { if (this.ctx && this.enabled && this.ctx.state === 'suspended') this.ctx.resume(); },
};

// ==== Game ===============================================================
const $ = id => document.getElementById(id);
const el = { sub: $('sub'), cue: $('cue'), startBtn: $('startBtn'), addBtn: $('addBtn'), ring: $('ring'), status: $('status'), pours: $('pours'), time: $('time'), card: $('card'), score: $('score'), stones: $('stones'), verdict: $('verdict'), breakdown: $('breakdown'), againBtn: $('againBtn'), soundBtn: $('soundBtn'), best: $('best'), debug: $('debug') };
const params = new URLSearchParams(location.search);
const SPEED = Math.max(0.1, parseFloat(params.get('speed')) || 1);
const DEBUG = params.get('debug') === '1';
const RING_LEN = 301.6;

let sim, state = 'idle', seed = 0, elapsed = 0, paused = false, lastTs = 0;
const hold = { active: false, V: 0, pointerId: null, kb: false };
let settleT = 0, previewR = 0, noCarryT = 0, cueShown = false;

function newGame(s) {
  seed = s >>> 0; sim = createSim(seed); state = 'idle'; elapsed = 0; settleT = 0; previewR = 0; noCarryT = 0; cueShown = false;
  hold.active = false; hold.V = 0; sim.setPreview(0);
  el.startBtn.hidden = false; el.addBtn.hidden = true; el.status.hidden = true; el.card.hidden = true; el.card.classList.remove('show');
  el.addBtn.classList.remove('glow', 'holding'); el.cue.classList.remove('show');
  el.sub.textContent = 'Start the rake. Then add exactly as much sand as the holes need, in one pour.';
  el.pours.textContent = '0'; el.time.textContent = '0:00'; setRing(0);
  showBest();
  if (DEBUG) { el.debug.hidden = false; history.replaceState(null, '', '?' + new URLSearchParams({ ...Object.fromEntries(params), seed }).toString()); }
}
function startGame() {
  if (state !== 'idle') return;
  state = 'raking'; el.startBtn.hidden = true; el.addBtn.hidden = false; el.status.hidden = false;
  el.sub.textContent = 'Hold Add sand to shape a pour, release to drop it. The rake carries it into the holes.';
  el.addBtn.focus({ preventScroll: true });
}
function showBest() { let b = null; try { b = localStorage.getItem('zen-garden-best'); } catch (e) {} el.best.textContent = b ? 'Best ' + b : ''; }
function saveBest(score) { try { const b = parseInt(localStorage.getItem('zen-garden-best') || '0', 10); if (score > b) localStorage.setItem('zen-garden-best', String(score)); } catch (e) {} }
function setRing(frac) { el.ring.setAttribute('stroke-dashoffset', (RING_LEN * (1 - Math.min(1, Math.max(0, frac)))).toFixed(1)); }
function fmtTime(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function beginHold(pointerId, kb) {
  if (state !== 'raking' || hold.active) return;
  hold.active = true; hold.V = 0; hold.pointerId = pointerId; hold.kb = !!kb;
  el.addBtn.classList.add('holding'); el.addBtn.classList.remove('glow'); el.cue.classList.remove('show'); cueShown = false; noCarryT = 0;
  audio.ensure(); audio.resume();
}
function releaseHold() {
  if (!hold.active) return;
  const V = hold.V; hold.active = false; hold.pointerId = null;
  el.addBtn.classList.remove('holding'); sim.setPreview(0); previewR = 0; setRing(0);
  if (V >= 0.02 * HOLD_CAP) { sim.pour(V); el.pours.textContent = String(sim.S.pours); audio.pour(); }
}
function cancelHold() {
  if (!hold.active) return;
  hold.active = false; hold.pointerId = null; hold.V = 0;
  el.addBtn.classList.remove('holding'); sim.setPreview(0); previewR = 0; setRing(0);
}

function finish() {
  const res = scoreFor(sim.S.pours, sim.S.added, sim.S.D);
  el.score.textContent = String(res.score);
  el.stones.innerHTML = Array.from({ length: 5 }, (_, i) => `<span class="${i < res.stones ? '' : 'off'}">●</span>`).join('');
  el.verdict.textContent = VERDICTS[res.stones - 1];
  const p = sim.S.pours; el.breakdown.textContent = `${p} pour${p === 1 ? '' : 's'} · ${excessWords(res.e)} · ${fmtTime(elapsed)}`;
  el.addBtn.hidden = true; el.status.hidden = true; el.cue.classList.remove('show');
  el.sub.textContent = 'Every hole is level. The rake keeps turning.';
  el.card.hidden = false; requestAnimationFrame(() => el.card.classList.add('show'));
  saveBest(res.score); showBest(); audio.chime();
  el.againBtn.focus({ preventScroll: true });
}

function update(dt) {
  const sdt = dt * SPEED;
  if (hold.active) { hold.V = Math.min(HOLD_CAP, hold.V + HOLD_RATE * dt); previewR = sim.setPreview(hold.V); setRing(hold.V / HOLD_CAP); }
  if (state === 'raking' || state === 'settling' || state === 'complete') sim.step(sdt);
  if (state === 'raking') {
    elapsed += sdt; el.time.textContent = fmtTime(elapsed);
    if (sim.isComplete()) { state = 'settling'; settleT = 0; cancelHold(); el.addBtn.disabled = true; }
    else {
      const ct = sim.carriedTotal();
      if (sim.S.t > CFG.ROT_PERIOD && ct < 0.01 * sim.S.D && !hold.active) noCarryT += sdt; else noCarryT = 0;
      if (noCarryT > 10 && !cueShown) { cueShown = true; el.cue.classList.add('show'); el.addBtn.classList.add('glow'); }
    }
  } else if (state === 'settling') {
    settleT += dt;
    if (settleT >= 1) { sim.snap(); state = 'complete'; el.addBtn.disabled = false; finish(); }
  }
  audio.setFlux(sim.S.flux, state === 'raking');
}
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function frame(ts) {
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (!paused && dt > 0) update(dt);
  render(sim, { settleK: state === 'settling' ? easeInOut(Math.min(1, settleT)) : (state === 'complete' ? 1 : 0), previewR });
  if (DEBUG) {
    const S = sim.S, cons = sim.total() - S.initialTotal - S.added;
    el.debug.textContent = `seed ${seed}  speed ${SPEED}x  state ${state}\nD ${S.D.toFixed(1)}  added ${S.added.toFixed(1)}  e ${((S.added - S.D) / S.D).toFixed(3)}\nremaining ${S.remaining.toFixed(2)} (${(S.remaining / S.D * 100).toFixed(2)}%)  carried ${sim.carriedTotal().toFixed(2)}\nconservation ${cons.toExponential(2)}  rotations ${S.rotations.toFixed(2)}  t ${S.t.toFixed(1)}s\nhold ${hold.V.toFixed(0)}  flux ${S.flux.toFixed(2)}`;
  }
  requestAnimationFrame(frame);
}

// --- input -------------------------------------------------------------
el.startBtn.addEventListener('click', () => { audio.ensure(); startGame(); });
el.againBtn.addEventListener('click', () => newGame((Math.random() * 2 ** 32) >>> 0));
el.soundBtn.addEventListener('click', () => { const on = !audio.enabled; audio.setEnabled(on); el.soundBtn.textContent = on ? 'Sound on' : 'Sound off'; el.soundBtn.setAttribute('aria-pressed', String(on)); try { localStorage.setItem('zen-garden-sound', on ? '1' : '0'); } catch (e) {} });
el.addBtn.addEventListener('pointerdown', e => { if (e.button !== 0 && e.pointerType === 'mouse') return; e.preventDefault(); try { el.addBtn.setPointerCapture(e.pointerId); } catch (err) {} beginHold(e.pointerId, false); });
el.addBtn.addEventListener('pointerup', e => { if (hold.active && !hold.kb && hold.pointerId === e.pointerId) releaseHold(); });
el.addBtn.addEventListener('pointercancel', e => { if (hold.active && !hold.kb && hold.pointerId === e.pointerId) cancelHold(); });
el.addBtn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) beginHold(null, true); } });
el.addBtn.addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'Enter') && hold.active && hold.kb) releaseHold(); });
el.addBtn.addEventListener('blur', () => { if (hold.active && hold.kb) cancelHold(); });
el.addBtn.addEventListener('contextmenu', e => e.preventDefault());
el.addBtn.addEventListener('click', e => e.preventDefault());
document.addEventListener('selectstart', e => { if (hold.active) e.preventDefault(); });
document.addEventListener('visibilitychange', () => { paused = document.hidden; if (paused) { audio.pause(); if (hold.active) cancelHold(); } else { lastTs = 0; audio.resume(); } });

// --- sizing ------------------------------------------------------------
function resize() { const dpr = Math.min(2, window.devicePixelRatio || 1), w = Math.round(canvas.clientWidth * dpr); if (w && canvas.width !== w) { canvas.width = canvas.height = w; } }
new ResizeObserver(resize).observe(canvas); resize();

// --- boot --------------------------------------------------------------
newGame(params.has('seed') ? parseInt(params.get('seed'), 10) >>> 0 : (Math.random() * 2 ** 32) >>> 0);
try { if (localStorage.getItem('zen-garden-sound') === '1') { el.soundBtn.textContent = 'Sound on'; el.soundBtn.setAttribute('aria-pressed', 'true'); audio.enabled = true; } } catch (e) {}
requestAnimationFrame(frame);
window.__debug = { get sim() { return sim; }, get state() { return state; }, start: startGame, pour: v => sim.pour(v), scoreFor, newGame, CFG };
</script>
</body>
</html>
