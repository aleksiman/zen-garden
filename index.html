<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen Garden</title>
<style>
:root{
  --linen:#F1EAE0; --paper:#F8F3EA; --sand:#F3F2EF; --wet:#B9B5AE;
  --tray:#2B2622; --tray-hi:#3A332D; --clay:#A8654A; --clay-dark:#8E5239; --moss:#6B7A5A;
  --ink:#2B2622; --muted:#7A6F63; --line:#E2D8C8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#5b4a3a url(assets/wood.jpg) calc(50% + 24px) center/cover no-repeat fixed;color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
main{width:min(92vw,560px);padding:30px 0 56px;display:flex;flex-direction:column;align-items:center;gap:22px}
header{text-align:center}
h1{font-weight:700;font-size:19px;letter-spacing:.01em;margin:0 0 8px}
.sub{margin:0 auto;color:rgba(248,243,234,.78);font-size:14px;line-height:1.55;max-width:100%;height:3.1em;overflow:hidden}
.sub .line{display:block;white-space:nowrap;opacity:0;transform:translateX(-16px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.sub .line:nth-child(2){transition-delay:.2s}
.sub .line.in{opacity:1;transform:none}
.tray-wrap{position:relative;width:100%;aspect-ratio:1}
canvas#garden{display:block;width:100%;height:100%;border-radius:50%;box-shadow:8px 8px 14px rgba(20,14,10,.38),26px 26px 54px -10px rgba(20,14,10,.55);touch-action:none;user-select:none;-webkit-user-select:none}
.controls{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;margin-top:18px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;color:var(--ink);background:var(--paper);padding:12px 22px;font-size:15px;transition:background .3s,color .3s,opacity .3s,transform .15s}
button:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
button[disabled]{opacity:.45;cursor:default}
.primary{background:var(--tray);color:var(--paper);padding:14px 30px;box-shadow:0 0 0 1px rgba(248,243,234,.18)}
.primary:hover{background:var(--tray-hi)}
.hold{position:relative;background:var(--tray);color:var(--paper);width:136px;height:136px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .6s,box-shadow 1.6s,transform .15s}
.hold small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.hold.holding{background:var(--tray-hi);transform:scale(.97)}
.hold svg{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.hold svg circle{fill:none;stroke-width:3}
.hold svg .track{stroke:rgba(248,243,234,.22)}
.hold svg .fill{stroke:var(--clay)}
.status{display:flex;gap:22px;color:rgba(248,243,234,.72);font-size:13px;letter-spacing:.02em}
.status b{color:var(--paper);font-weight:500}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.ghost{background:transparent;color:rgba(248,243,234,.72);padding:8px 12px;font-size:13px}
.ghost:hover{color:var(--paper)}
.overlay{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(241,234,224,.38);opacity:0;transition:opacity 1.2s ease-in-out}
.overlay.show{opacity:1}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:26px 26px 24px;width:min(84%,380px);text-align:center;box-shadow:0 18px 44px -20px rgba(43,38,34,.45);transform:translateY(10px) scale(.97);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.overlay.show .card{transform:none}
.card .row{margin-top:4px}
.card .label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.card .score{font-family:var(--serif);font-size:58px;line-height:1.05;margin:6px 0 10px}
.card .stones{font-size:22px;letter-spacing:.32em;color:var(--moss);margin-bottom:14px}
.card .stones .off{color:var(--line)}
.card .verdict{font-family:var(--serif);font-style:italic;font-size:19px;margin:0 0 10px}
.card .breakdown{color:var(--muted);font-size:14px;margin:0 0 18px}
.secondary{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.secondary:hover{background:rgba(43,38,34,.05)}
.debug{position:fixed;left:8px;top:8px;font:11px/1.45 ui-monospace,Menlo,monospace;color:var(--muted);background:rgba(248,243,234,.92);padding:6px 9px;border-radius:8px;white-space:pre;pointer-events:none}
[hidden]{display:none!important}
@media (max-width:420px){.card .score{font-size:50px}.sub{font-size:13px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Zen Garden</h1>
    <p class="sub" id="sub" aria-live="polite"></p>
  </header>
  <div class="tray-wrap">
    <canvas id="garden" aria-label="Sand garden with a rotating rake"></canvas>
    <div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="score">
      <div class="card" id="card">
        <div class="label">Garden complete</div>
        <div class="score" id="score">0</div>
        <div class="stones" id="stones" aria-label="Rating"></div>
        <p class="verdict" id="verdict"></p>
        <p class="breakdown" id="breakdown"></p>
        <div class="row">
          <button class="secondary" id="admireBtn">Admire your work</button>
          <button class="primary" id="againBtn">Start a new garden</button>
        </div>
      </div>
    </div>
  </div>
  <section class="controls">
    <button class="primary" id="startBtn">Start raking</button>
    <button class="primary" id="newBtn" hidden>Start a new garden</button>
    <button class="hold" id="addBtn" hidden aria-label="Add sand. Press and hold, release to pour.">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="48"/><circle class="fill" id="ring" cx="50" cy="50" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg>
      <span>Add sand</span><small>hold</small>
    </button>
    <div class="status" id="status" hidden><span>Pours <b id="pours">0</b></span><span>Time <b id="time">0:00</b></span></div>
    <div class="row">
      <button class="ghost" id="soundBtn" aria-pressed="false">Sound off</button>
    </div>
  </section>
</main>
<div class="debug" id="debug" hidden></div>
<script>
'use strict';
// ==== SIM BEGIN ==========================================================
// Everything between SIM BEGIN and SIM END is pure and DOM-free, so it can
// be extracted and run in Node for tuning (see README).
const CFG = {
  N: 200,            // heightmap grid
  L: 1,              // level height
  POST_FRAC: 0.06,   // center post radius as fraction of R
  ROT_PERIOD: 24,    // seconds per rotation
  NBINS: 40,         // radial bins for carried sand
  K_DIFF: 0.09,      // carried-sand diffusion per 1/60 s (tuned: 1.08·D pour fills in ~5.5 rotations)
  MAX_STEP: 5 * Math.PI / 180,
  SLOPE: 0.03,       // angle of repose: height per cell, shared by holes and pours
  HOPPER_R: 0.55,    // hopper spot radius as fraction of R
  HOPPER_ANG: -Math.PI / 2,
  D_REF: 900,        // reference deficit in sand units (cell area x height)
  D_MIN_F: 0.7, D_MAX_F: 1.3,
  HOLD_MID_S: 8,     // seconds of hold to reach D_REF
  HOLD_CAP_S: 16,    // hard cap
  RIM_MARGIN: 0.08,
  GROOM_EPS: 0.01,
  END_FRAC: 0.005,
  END_DEPTH: 0.015,  // no cell may be deeper than this below level: the last hole must really be filled by a pass
  TOOTH: 4,          // ripple spacing in cells
  SMOOTH: 0.1575,    // how much each pass of the bar evens out the surface it crosses (conservative)
  BASE_ROLL: 1.2,    // cells of sand the bar always rolls ahead of itself (visual floor)
  BAR_HALF: 0.0289,  // half width of the bar as a fraction of R (shared by sim and renderer)
  PILE_EPS: 0.05,    // height above level that counts as pile when measuring the poured cone
  S_CRIT: 0.06,      // angle of repose for slides: 2 x SLOPE, above the ideal cone's steepest face (1.5 x SLOPE)
  RELAX_K: 0.5,      // fraction of the excess slope moved per relaxation pass
  SLIDE_R: 8,        // radius (cells) of one slide
  SLIDE_FRAMES: 8,   // frames one slide lasts
  CAP_FRAC: 0.08,    // share of poured sand that lands as a steep cap at the spout (the rest fills the cone)
  CAP_SIGMA: 3,      // cells; width of that cap
};
const HOLD_RATE = CFG.D_REF / CFG.HOLD_MID_S;
const HOLD_CAP = HOLD_RATE * CFG.HOLD_CAP_S;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function smoothstep(e0, e1, x) { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }
// Rounded cone: profile(d) = depth * (1 - smoothstep(0, r, d)); volume = 0.3 * pi * depth * r^2, depth = slope * r
function coneRadiusForVolume(V, slope = CFG.SLOPE) { return Math.cbrt(Math.max(0, V) / (0.3 * Math.PI * slope)); }

function createSim(seed) {
  const N = CFG.N, L = CFG.L, rnd = mulberry32(seed);
  const cx = N / 2, cy = N / 2, R = N / 2 - 2, postR = CFG.POST_FRAC * R;
  const h = new Float64Array(N * N);
  const mask = new Uint8Array(N * N), groomed = new Uint8Array(N * N), binOf = new Uint8Array(N * N);
  const cellR = new Float32Array(N * N), cellX = new Float32Array(N * N), cellY = new Float32Array(N * N), cellAng = new Float32Array(N * N);
  const order = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const idx = j * N + i, x = i + 0.5 - cx, y = j + 0.5 - cy, r = Math.hypot(x, y);
    cellX[idx] = x; cellY[idx] = y; cellR[idx] = r;
    let a = Math.atan2(y, x); if (a < 0) a += 2 * Math.PI; cellAng[idx] = a;
    if (r <= R && r >= postR) {
      mask[idx] = 1;
      binOf[idx] = Math.min(CFG.NBINS - 1, Math.floor((r - postR) / (R - postR) * CFG.NBINS));
      order.push(idx);
    }
  }
  order.sort((a, b) => cellAng[a] - cellAng[b]);
  const orderArr = Uint32Array.from(order), orderAng = Float64Array.from(order, i => cellAng[i]);
  const M = orderArr.length;
  let maxBelow = 0; // deepest dip below level, refreshed by deficit()

  // --- terrain -----------------------------------------------------------
  function valueNoise(cells, amp) {
    const g = cells + 1, grid = new Float32Array(g * g);
    for (let k = 0; k < g * g; k++) grid[k] = rnd() * 2 - 1;
    return (x, y) => {
      const fx = x / N * cells, fy = y / N * cells, ix = Math.min(cells - 1, Math.floor(fx)), iy = Math.min(cells - 1, Math.floor(fy));
      const tx = smoothstep(0, 1, fx - ix), ty = smoothstep(0, 1, fy - iy);
      const v00 = grid[iy * g + ix], v10 = grid[iy * g + ix + 1], v01 = grid[(iy + 1) * g + ix], v11 = grid[(iy + 1) * g + ix + 1];
      return amp * ((v00 * (1 - tx) + v10 * tx) * (1 - ty) + (v01 * (1 - tx) + v11 * tx) * ty);
    };
  }
  const n0 = valueNoise(3, 0.02), n1 = valueNoise(6, 0.02), n2 = valueNoise(14, 0.008);
  for (let k = 0; k < M; k++) { const idx = orderArr[k]; const i = idx % N, j = (idx - i) / N; h[idx] = L + n0(i, j) + n1(i, j) + n2(i, j); }

  const hopper = { x: cx + CFG.HOPPER_R * R * Math.cos(CFG.HOPPER_ANG), y: cy + CFG.HOPPER_R * R * Math.sin(CFG.HOPPER_ANG) };
  const features = [{ x: hopper.x, y: hopper.y, r: 10 }];
  function place(r) {
    for (let t = 0; t < 600; t++) {
      const a = rnd() * 2 * Math.PI, rr = Math.sqrt(rnd()) * (R * (1 - CFG.RIM_MARGIN) - r);
      if (rr < postR + r) continue;
      const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
      let ok = true;
      for (const f of features) if (Math.hypot(x - f.x, y - f.y) < 1.15 * (r + f.r)) { ok = false; break; }
      if (ok) { features.push({ x, y, r }); return { x, y }; }
    }
    return null;
  }
  // shape(angle) scales the radius around the outline so holes are not perfect circles
  function makeShape() {
    const a = [0.18 + rnd() * 0.12, 0.10 + rnd() * 0.10, 0.06 + rnd() * 0.06, 0.03 + rnd() * 0.05], ph = [rnd() * 6.283, rnd() * 6.283, rnd() * 6.283, rnd() * 6.283];
    return ang => 1 + a[0] * Math.sin(ang + ph[0]) + a[1] * Math.sin(2 * ang + ph[1]) + a[2] * Math.sin(3 * ang + ph[2]) + a[3] * Math.sin(5 * ang + ph[3]);
  }
  function addCone(x0, y0, r, depth, sign, arr, ungroom, shape) {
    let vol = 0; const rb = shape ? r * 1.75 : r;
    const i0 = Math.max(0, Math.floor(x0 - rb - 1)), i1 = Math.min(N - 1, Math.ceil(x0 + rb + 1));
    const j0 = Math.max(0, Math.floor(y0 - rb - 1)), j1 = Math.min(N - 1, Math.ceil(y0 + rb + 1));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const idx = j * N + i; if (!mask[idx]) continue;
      const dx = i + 0.5 - x0, dy = j + 0.5 - y0, d = Math.hypot(dx, dy);
      const re = shape ? r * shape(Math.atan2(dy, dx)) : r;
      if (ungroom && d < re + 1.5) groomed[idx] = 0; // clear tracks a little beyond the pile's foot
      if (d >= re) continue;
      const v = depth * (1 - smoothstep(0, re, d));
      arr[idx] += sign * v; vol += v;
    }
    return vol;
  }
  // small bumps: uneven look, <= 5% of D
  const Dtarget = CFG.D_REF * (CFG.D_MIN_F + rnd() * (CFG.D_MAX_F - CFG.D_MIN_F));
  const nb = 2 + Math.floor(rnd() * 2), bumpV = Dtarget * 0.05 / nb;
  for (let k = 0; k < nb; k++) { const r = coneRadiusForVolume(bumpV, CFG.SLOPE * 0.5); const p = place(r); if (p) addCone(p.x, p.y, r, CFG.SLOPE * 0.5 * r, +1, h, false); }
  // holes: rounded cones with the shared slope, scaled so D lands on target
  const nh = 4 + Math.floor(rnd() * 4), weights = []; let ws = 0;
  for (let k = 0; k < nh; k++) { const w = 0.5 + rnd(); weights.push(w); ws += w; }
  const holes = [];
  for (let k = 0; k < nh; k++) { const V = Dtarget * weights[k] / ws, r = coneRadiusForVolume(V); const p = place(r * 1.2); if (p) holes.push({ x: p.x, y: p.y, V, shape: makeShape() }); }
  const base = Float64Array.from(h);
  let scale = 1;
  for (let it = 0; it < 4; it++) {
    h.set(base);
    for (const ho of holes) { const r = coneRadiusForVolume(ho.V * scale); ho.r = r; addCone(ho.x, ho.y, r, CFG.SLOPE * r, -1, h, false, ho.shape); }
    const d = deficit() - excessAbove();
    if (Math.abs(d - Dtarget) / Dtarget < 0.01) break;
    scale *= Math.min(1.4, Math.max(0.7, Dtarget / Math.max(1, d)));
  }

  // --- state -------------------------------------------------------------
  const carried = [new Float64Array(CFG.NBINS), new Float64Array(CFG.NBINS)];
  const tmp = new Float64Array(CFG.NBINS);
  const S = { theta: 0, t: 0, added: 0, pours: 0, D: 0, initialTotal: 0, remaining: 0, maxBelow: 0, flux: 0, rotations: 0, lastCheck: 0, slides: 0, shave: 0, holeFrac: 0 };
  S.D = deficit() - excessAbove();
  S.remaining = deficit();
  S.initialTotal = total();

  function deficit() { let d = 0, mx = 0; for (let k = 0; k < M; k++) { const v = L - h[orderArr[k]]; if (v > 0) { d += v; if (v > mx) mx = v; } } maxBelow = mx; return d; }
  function excessAbove() { let d = 0; for (let k = 0; k < M; k++) { const v = h[orderArr[k]] - L; if (v > 0) d += v; } return d; }
  function total() { let s = 0; for (let k = 0; k < M; k++) s += h[orderArr[k]]; for (let b = 0; b < CFG.NBINS; b++) s += carried[0][b] + carried[1][b]; return s; }
  function carriedTotal() { let s = 0; for (let b = 0; b < CFG.NBINS; b++) s += carried[0][b] + carried[1][b]; return s; }

  function lowerBound(a) { let lo = 0, hi = M; while (lo < hi) { const mid = (lo + hi) >> 1; if (orderAng[mid] < a) lo = mid + 1; else hi = mid; } return lo; }
  const TWO = 2 * Math.PI;
  let swept = 0, holeCells = 0; // per step, for the sound
  function sweep(a0, da, c, toothed) {
    a0 = ((a0 % TWO) + TWO) % TWO;
    let k = lowerBound(a0); if (k >= M) k = 0;
    for (let n = 0; n < M; n++) {
      let rel = orderAng[k] - a0; if (rel < 0) rel += TWO;
      if (rel >= da) break;
      const idx = orderArr[k], b = binOf[idx], v = h[idx];
      swept++; if (L - v > 0.08) holeCells++;
      if (v > L) { c[b] += v - L; h[idx] = L; S.flux += v - L; S.shave += v - L; groomed[idx] = toothed; }
      else if (v < L) {
        const need = L - v, f = c[b] < need ? c[b] : need;
        if (f > 0) { h[idx] = v + f; c[b] -= f; S.flux += f; }
        groomed[idx] = (L - h[idx] <= CFG.GROOM_EPS) ? toothed : 0;
      } else groomed[idx] = toothed;
      // the passing bar nudges sand from high neighbours to low ones: rims slump into holes a little every pass.
      // Only between cells at or below level, so nothing is pulled back out of an unshaved pile ahead of the bar.
      if (mask[idx + 1] && h[idx + 1] <= L) { const f = CFG.SMOOTH * (h[idx + 1] - h[idx]); h[idx] += f; h[idx + 1] -= f; }
      if (mask[idx + N] && h[idx + N] <= L) { const f = CFG.SMOOTH * (h[idx + N] - h[idx]); h[idx] += f; h[idx + N] -= f; }
      k++; if (k >= M) k = 0;
    }
  }
  function diffuse(c, k) {
    const n = c.length;
    for (let b = 0; b < n; b++) { const l = b > 0 ? c[b - 1] : c[b], r = b < n - 1 ? c[b + 1] : c[b]; tmp[b] = c[b] + k * (l + r - 2 * c[b]); }
    c.set(tmp);
  }
  function step(dt) {
    if (dt <= 0) return;
    const dth = TWO / CFG.ROT_PERIOD * dt;
    const nsub = Math.max(1, Math.ceil(dth / CFG.MAX_STEP), Math.ceil(CFG.K_DIFF * dt * 60 / 0.4));
    const sdt = dt / nsub, sdth = dth / nsub, k = CFG.K_DIFF * sdt * 60;
    S.flux = 0; S.shave = 0; swept = 0; holeCells = 0;
    for (let s = 0; s < nsub; s++) {
      const a0 = S.theta; S.theta += sdth;
      sweep(a0, sdth, carried[0], 1);
      sweep(a0 + Math.PI, sdth, carried[1], 0);
      diffuse(carried[0], k); diffuse(carried[1], k);
    }
    S.t += dt; S.rotations = S.theta / TWO; S.flux /= dt; S.shave /= dt; S.holeFrac = swept ? holeCells / swept : 0;
    relax(dt);
    if (S.t - S.lastCheck >= 0.5) { S.lastCheck = S.t; S.remaining = deficit(); S.maxBelow = maxBelow; }
  }
  // one-shot cone (debug/harness); the game pours continuously through deposit()
  function pour(V) {
    const r = coneRadiusForVolume(V);
    const actual = addCone(hopper.x, hopper.y, r, CFG.SLOPE * r, +1, h, true);
    S.added += actual; S.remaining = deficit();
    return actual;
  }
  function countPour() { S.pours++; }

  // --- continuous pouring -------------------------------------------------
  // Sand lands while the button is held. The pile in the hopper box is measured and grown as the
  // next shell of the ideal cone, so a stack of holds is one cone and a cut pile regrows from what is left.
  const hopBox = (() => { const rb = Math.ceil(coneRadiusForVolume(3 * HOLD_CAP)) + 3; return { i0: Math.max(0, Math.floor(hopper.x - rb)), i1: Math.min(N - 1, Math.ceil(hopper.x + rb)), j0: Math.max(0, Math.floor(hopper.y - rb)), j1: Math.min(N - 1, Math.ceil(hopper.y + rb)) }; })();
  function prof(r, d) { return d >= r ? 0 : CFG.SLOPE * r * (1 - smoothstep(0, r, d)); }
  function inBarZone(idx, ct, st, band) { const ly = -cellX[idx] * st + cellY[idx] * ct; return ly <= band && ly >= -band; }
  function deposit(dV) {
    if (dV <= 0) return 0;
    const ct = Math.cos(S.theta), st = Math.sin(S.theta), band = CFG.BAR_HALF * R;
    let Vloc = 0;
    for (let j = hopBox.j0; j <= hopBox.j1; j++) for (let i = hopBox.i0; i <= hopBox.i1; i++) { const idx = j * N + i; if (mask[idx] && h[idx] > L + CFG.PILE_EPS) Vloc += h[idx] - L; }
    let landed = 0, dMain = dV;
    // a small share lands as a steep cap right under the spout; slides carry it down the flank
    {
      const dCap = dV * CFG.CAP_FRAC, sig = CFG.CAP_SIGMA, rr = sig * 2.7, k2 = 1 / (2 * sig * sig);
      const i0 = Math.max(0, Math.floor(hopper.x - rr)), i1 = Math.min(N - 1, Math.ceil(hopper.x + rr)), j0 = Math.max(0, Math.floor(hopper.y - rr)), j1 = Math.min(N - 1, Math.ceil(hopper.y + rr));
      let wsum = 0;

function fmtTime(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function beginHold(pointerId, kb) {
  if (state !== 'raking' || hold.active) return;
  hold.active = true; hold.V = 0; hold.pointerId = pointerId; hold.kb = !!kb;
  el.addBtn.classList.add('holding');
  audio.ensure(); audio.resume();
}
// The sand has already landed while holding; ending the hold only decides whether it counted as a pour.
function endHold() {
  if (!hold.active) return;
  const V = hold.V; hold.active = false; hold.pointerId = null; hold.V = 0;
  el.addBtn.classList.remove('holding'); setRing(0);
  if (V >= 0.02 * HOLD_CAP) { sim.countPour(); el.pours.textContent = String(sim.S.pours); audio.pour(); }
}
const releaseHold = endHold, cancelHold = endHold;

function finish() {
  const res = scoreFor(sim.S.pours, sim.S.added, sim.S.D);
  el.score.textContent = String(res.score);
  el.stones.innerHTML = Array.from({ length: 5 }, (_, i) => `<span class="${i < res.stones ? '' : 'off'}">●</span>`).join('');
  el.verdict.textContent = VERDICTS[res.stones - 1];
  const p = sim.S.pours; el.breakdown.textContent = `${p} pour${p === 1 ? '' : 's'} · ${excessWords(res.e)} · ${fmtTime(elapsed)}`;
  el.addBtn.hidden = true; el.status.hidden = true;
  setSub('Every hole is level.', 'The rake keeps turning.');
  audio.chime();
  overlayTimer = setTimeout(showOverlay, 2000);
}
function showOverlay() {
  overlayTimer = null; el.overlay.hidden = false;
  void el.overlay.offsetWidth; // flush styles so the opacity transition starts from 0
  requestAnimationFrame(() => { el.overlay.classList.add('show'); el.admireBtn.focus({ preventScroll: true }); });
}
function hideOverlay() {
  if (!el.overlay.classList.contains('show')) return;
  el.overlay.classList.remove('show');
  const done = () => { el.overlay.removeEventListener('transitionend', done); if (state === 'complete' && !el.overlay.classList.contains('show')) { el.overlay.hidden = true; el.newBtn.hidden = false; el.newBtn.focus({ preventScroll: true }); } };
  el.overlay.addEventListener('transitionend', done);
  setTimeout(done, 1400); // fallback if no transitionend arrives
}

function update(dt) {
  const sdt = dt * SPEED;
  if (hold.active) { hold.V += sim.deposit(Math.min(HOLD_RATE * dt, HOLD_CAP - hold.V)); setRing(hold.V / HOLD_CAP); }
  if (state === 'raking' || state === 'settling' || state === 'complete') sim.step(sdt);
  if (state === 'raking') {
    elapsed += sdt; el.time.textContent = fmtTime(elapsed);
    if (sim.isComplete()) { state = 'settling'; settleT = 0; cancelHold(); el.addBtn.disabled = true; }
  } else if (state === 'settling') {
    settleT += dt;
    if (settleT >= 1.2) { sim.snap(); state = 'complete'; el.addBtn.disabled = false; finish(); } // snap moves nothing visible: max dip is below END_DEPTH
  }
  audio.setSand(sim.S.shave, sim.S.holeFrac, state === 'raking', hold.active);
}
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function frame(ts) {
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (!paused && dt > 0) update(dt);
  render(sim, { settleK: 0 });
  if (DEBUG) {
    const S = sim.S, cons = sim.total() - S.initialTotal - S.added;
    el.debug.textContent = `seed ${seed}  speed ${SPEED}x  state ${state}\nD ${S.D.toFixed(1)}  added ${S.added.toFixed(1)}  e ${((S.added - S.D) / S.D).toFixed(3)}\nremaining ${S.remaining.toFixed(2)} (${(S.remaining / S.D * 100).toFixed(2)}%)  carried ${sim.carriedTotal().toFixed(2)}\nconservation ${cons.toExponential(2)}  rotations ${S.rotations.toFixed(2)}  t ${S.t.toFixed(1)}s\nhold ${hold.V.toFixed(0)}  flux ${S.flux.toFixed(2)}`;
  }
  requestAnimationFrame(frame);
}

// --- input -------------------------------------------------------------
el.startBtn.addEventListener('click', () => { audio.ensure(); startGame(); });
el.againBtn.addEventListener('click', () => newGame((Math.random() * 2 ** 32) >>> 0));
el.newBtn.addEventListener('click', () => newGame((Math.random() * 2 ** 32) >>> 0));
el.admireBtn.addEventListener('click', hideOverlay);
el.soundBtn.addEventListener('click', () => { const on = !audio.enabled; audio.setEnabled(on); el.soundBtn.textContent = on ? 'Sound on' : 'Sound off'; el.soundBtn.setAttribute('aria-pressed', String(on)); try { localStorage.setItem('zen-garden-sound', on ? '1' : '0'); } catch (e) {} });
el.addBtn.addEventListener('pointerdown', e => { if (e.button !== 0 && e.pointerType === 'mouse') return; e.preventDefault(); try { el.addBtn.setPointerCapture(e.pointerId); } catch (err) {} beginHold(e.pointerId, false); });
el.addBtn.addEventListener('pointerup', e => { if (hold.active && !hold.kb && hold.pointerId === e.pointerId) releaseHold(); });
el.addBtn.addEventListener('pointercancel', e => { if (hold.active && !hold.kb && hold.pointerId === e.pointerId) cancelHold(); });
el.addBtn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) beginHold(null, true); } });
el.addBtn.addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'Enter') && hold.active && hold.kb) releaseHold(); });
el.addBtn.addEventListener('blur', () => { if (hold.active && hold.kb) cancelHold(); });
el.addBtn.addEventListener('contextmenu', e => e.preventDefault());
el.addBtn.addEventListener('click', e => e.preventDefault());
document.addEventListener('selectstart', e => { if (hold.active) e.preventDefault(); });
document.addEventListener('visibilitychange', () => { paused = document.hidden; if (paused) { audio.pause(); if (hold.active) cancelHold(); } else { lastTs = 0; audio.resume(); } });

// --- sizing ------------------------------------------------------------
function resize() { const dpr = Math.min(2, window.devicePixelRatio || 1), w = Math.round(canvas.clientWidth * dpr); if (w && canvas.width !== w) { canvas.width = canvas.height = w; } }
new ResizeObserver(resize).observe(canvas); resize();

// --- boot --------------------------------------------------------------
newGame(params.has('seed') ? parseInt(params.get('seed'), 10) >>> 0 : (Math.random() * 2 ** 32) >>> 0);
try { if (localStorage.getItem('zen-garden-sound') === '1') { el.soundBtn.textContent = 'Sound on'; el.soundBtn.setAttribute('aria-pressed', 'true'); audio.enabled = true; } } catch (e) {}
requestAnimationFrame(frame);
window.__debug = { get sim() { return sim; }, get state() { return state; }, start: startGame, pour: v => sim.pour(v), scoreFor, newGame, CFG, render: () => render(sim, { settleK: 0 }), tick: dt => update(dt), deposit: v => sim.deposit(v), relaxAll: n => sim.relaxAll(n || 10), HOLD_RATE, HOLD_CAP };
</script>
</body>
</html>
